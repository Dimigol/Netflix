name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f backend/Dockerfile -t netflix-clone-backend .

      - name: Smoke test container
        run: |
          docker run -d --name netflix-test -p 5001:5001 \
            -e MONGODB_URI=mongodb://invalid-host:27017/test \
            -e JWT_SECRET=ci-test-secret \
            -e PORT=5001 \
            netflix-clone-backend

          for i in $(seq 1 15); do
            if curl -sf http://localhost:5001/api/health; then break; fi
            sleep 1
          done

          curl -sf http://localhost:5001/api/health
          curl -sf http://localhost:5001/ | grep -qi netflix

          docker logs netflix-test
          docker stop netflix-test
