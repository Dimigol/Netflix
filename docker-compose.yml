version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: netflix-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - mongodb_data:/data/db
    networks:
      - netflix-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: netflix-backend
    ports:
      - "5001:5001"
    environment:
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/netflix-clone?authSource=admin
      JWT_SECRET: your-secret-key-here-change-in-production
      NODE_ENV: development
      PORT: 5001
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - /app/backend/node_modules
    networks:
      - netflix-network
    command: npm run dev

volumes:
  mongodb_data:

networks:
  netflix-network:
    driver: bridge
