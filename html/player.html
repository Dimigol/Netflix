<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistindo - Netflix</title>
    <link rel="icon" href="../assets/logo.jpg" type="image/x-icon">
    <link rel="stylesheet" href="../css/player.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="player-wrapper">
        <!-- Header -->
        <header class="player-header">
            <a href="catalogo.html" class="back-btn" aria-label="Voltar">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h1 class="player-title"></h1>
            <div class="header-spacer"></div>
        </header>

        <!-- Video Container -->
        <div class="video-container">
            <iframe
                id="video-player"
                class="video-player"
                frameborder="0"
                allow="autoplay; encrypted-media"
                allowfullscreen
            ></iframe>
        </div>

        <!-- Content Info -->
        <div class="content-info">
            <div class="info-container">
                <h2 class="content-title"></h2>
                <div class="info-meta">
                    <span class="match-score"></span>
                    <span class="age-badge"></span>
                    <span class="duration"></span>
                </div>
                <div class="info-tags"></div>
                <p class="content-description"></p>

                <div class="action-buttons">
                    <button class="btn-like"><i class="fas fa-thumbs-up"></i> Gostei</button>
                    <button class="btn-dislike"><i class="fas fa-thumbs-down"></i> Não gostei</button>
                    <button class="btn-share"><i class="fas fa-share"></i> Compartilhar</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../js/player.js"></script>
</body>

</html>
